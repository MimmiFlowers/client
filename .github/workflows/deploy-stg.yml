name: Deploy Client to Staging

on:
  push:
    branches: [staging]

concurrency:
  group: staging-deploy-client
  cancel-in-progress: true

jobs:
  # Lint, type check, tests and build first; nothing reaches EC2 unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STG_SSH_HOST }}
          username: ${{ secrets.STG_SSH_USER }}
          key: ${{ secrets.STG_SSH_KEY }}
          # Default is 10m; the image build runs on a t3.micro. `set -e` below stops on errors.
          command_timeout: 20m
          script: |
            set -e
            cd /opt/stg/client
            git fetch origin staging
            git reset --hard origin/staging

            cd /opt/stg
            docker compose -f docker-compose.stg.yml build client
            docker compose -f docker-compose.stg.yml up -d client
            docker compose -f docker-compose.stg.yml exec -T nginx nginx -s reload

            # Reclaim disk space
            docker image prune -f
            docker builder prune -f --keep-storage=500MB
