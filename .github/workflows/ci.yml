name: Client CI

on:
  push:
    branches: [main, staging, AgentProdFixedVersion]
  pull_request:
    branches: [main, staging]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_URL: https://api.mimmiflowers.se
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder
        run: npm run build
